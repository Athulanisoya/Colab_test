services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resq
      POSTGRES_USER: resq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resq-local-demo-password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq -d resq"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://resq:${POSTGRES_PASSWORD:-resq-local-demo-password}@db:5432/resq
      JWT_SECRET: ${JWT_SECRET:-local-resq-development-only-change-before-deployment-2026}
      DEMO_MODE: ${DEMO_MODE:-true}
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b-it-q4_K_M}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-180}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-offline}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      RESQ_GEOCODING_ENABLED: ${RESQ_GEOCODING_ENABLED:-true}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  uploads:

